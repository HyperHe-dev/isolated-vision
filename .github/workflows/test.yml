name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: isolated-vision/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r isolated-vision/requirements.txt
      - name: Compile launcher
        run: python -m py_compile isolated-vision/scripts/vision.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
