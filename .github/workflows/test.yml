name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: image-rollout-shim/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r image-rollout-shim/requirements.txt
      - name: Compile launcher
        run: python -m py_compile image-rollout-shim/scripts/run_isolated_vision.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
